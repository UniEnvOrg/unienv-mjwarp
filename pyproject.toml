[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unienv_mjwarp"
version = "0.0.1a1"
description = "MuJoCo Warp adaptor for UniEnv's World / WorldNode / WorldEnv"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["unienv>=0.0.1b16", "mujoco", "mujoco-warp", "torch", "numpy", "scipy", "trimesh", "pyyaml"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/UniEnvOrg/unienv-mjwarp"
Repository = "https://github.com/UniEnvOrg/unienv-mjwarp"
Issues = "https://github.com/UniEnvOrg/unienv-mjwarp/issues"

[tool.setuptools.packages.find]
include = ["unienv_mjwarp*"]

[tool.setuptools.package-data]
unienv_mjwarp_collection = ["assets/hands/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
